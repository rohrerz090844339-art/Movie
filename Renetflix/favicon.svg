<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <!-- Netflix Red Ribbon Gradients -->
    <linearGradient id="redStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b81d24"/>
      <stop offset="100%" stop-color="#e50914"/>
    </linearGradient>

    <linearGradient id="redLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2633"/>
      <stop offset="70%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#b20710"/>
    </linearGradient>

    <linearGradient id="redLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>

    <!-- Ribbon Drop Shadow -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Background Icon Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- Left Vertical Stem (Darker Ribbon Layer) -->
  <rect x="15" y="11" width="10.5" height="42" rx="1.5" fill="url(#redStem)"/>

  <!-- Diagonal Leg (Bottom Fold) -->
  <path d="M25 30 L40 53 H51.5 L34 27 Z" fill="url(#redLeg)" filter="url(#ribbonShadow)"/>

  <!-- Upper Loop of the 'R' (Bright Foreground Ribbon) -->
  <path d="M15 11 H33.5 C42.5 11, 48 15.5, 48 22.5 C48 29.5, 42.5 34, 33.5 34 H25.5 V23.5 H33 C36.5 23.5, 38.5 22, 38.5 20 C38.5 18, 36.5 16.5, 33 16.5 H25.5 Z" fill="url(#redLoop)" filter="url(#ribbonShadow)"/>

  <!-- Subtle Netflix Glow Edge -->
  <path d="M15 11 H25.5 V53 H15 Z" fill="#ffffff" opacity="0.08"/>
</svg>
